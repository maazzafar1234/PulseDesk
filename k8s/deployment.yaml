apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsedesk
  namespace: production
  labels:
    app: pulsedesk
    component: backend
    version: "1.0.0"
  annotations:
    description: "PulseDesk backend API deployment"
    maintainer: "DevOps Team"

spec:
  replicas: 3  # Scale to 3 replicas for HA
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # One pod over desired count during rolling update
      maxUnavailable: 0  # No pods unavailable (zero-downtime deployment)
  
  selector:
    matchLabels:
      app: pulsedesk
      component: backend
  
  template:
    metadata:
      labels:
        app: pulsedesk
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    
    spec:
      # Service Account for RBAC
      serviceAccountName: pulsedesk
      
      # Security Context for Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      # Pod Disruption Budget for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - pulsedesk
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: pulsedesk-api
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/pulsedesk:latest  # Update ECR repo
          imagePullPolicy: IfNotPresent
          
          # Container security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          
          # Ports
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          
          # Environment Variables
          env:
            - name: NODE_ENV
              value: "production"
            
            - name: PORT
              value: "5000"
            
            # Database Configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsedesk-secrets
                  key: database-url
            
            # JWT Secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulsedesk-secrets
                  key: jwt-secret
            
            # CORS Frontend URL
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsedesk-config
                  key: frontend-url
            
            # AWS Configuration
            - name: AWS_REGION
              value: "us-east-1"
            
            # Logging
            - name: LOG_LEVEL
              value: "info"
            
            # Prometheus
            - name: PROMETHEUS_ENABLED
              value: "true"
          
          # Resource Requests and Limits
          resources:
            requests:
              cpu: 250m           # 0.25 CPU cores
              memory: 512Mi       # 512 MB RAM
              ephemeral-storage: 100Mi
            limits:
              cpu: 1000m          # 1 CPU core max
              memory: 1Gi         # 1 GB RAM max
              ephemeral-storage: 500Mi
          
          # Liveness Probe - Restart container if it's down
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          
          # Readiness Probe - Remove from load balancer if not ready
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
          
          # Startup Probe - Give container time to start
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20  # 20 * 5 = 100 seconds to start
          
          # Volume Mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/node_modules/.cache
          
          # Lifecycle hooks
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 15  # Wait 15 seconds before killing container
      
      # Volumes
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      
      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# ServiceAccount for RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsedesk
  namespace: production
  labels:
    app: pulsedesk

---
# Role for basic permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulsedesk
  namespace: production
  labels:
    app: pulsedesk

rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulsedesk
  namespace: production
  labels:
    app: pulsedesk

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulsedesk
subjects:
  - kind: ServiceAccount
    name: pulsedesk
    namespace: production
