apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsedesk
  namespace: production
  labels:
    app: pulsedesk
  annotations:
    # AWS ALB Ingress Controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
    # SSL/TLS Configuration
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/xxxxx  # Update with your ACM cert
    
    # Health Check
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '3'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    
    # Load Balancer Attributes
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.connection.keep_alive.enabled=true,idle_timeout.connection.keep_alive.timeout=60
    
    # Logging
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=pulsedesk-logs,access_logs.s3.prefix=alb
    
    # Tags for ALB
    alb.ingress.kubernetes.io/tags: Environment=production,Service=pulsedesk

spec:
  rules:
    # Backend API Route
    - host: api.pulsedesk.example.com  # Update with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulsedesk
                port:
                  number: 80
    
    # Metrics endpoint (internal only)
    - host: metrics.pulsedesk.example.com  # Internal metrics domain
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: pulsedesk
                port:
                  number: 9090

---
# Network Policy for network security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulsedesk
  namespace: production
  labels:
    app: pulsedesk

spec:
  podSelector:
    matchLabels:
      app: pulsedesk
      component: backend
  
  policyTypes:
    - Ingress
    - Egress
  
  # Allow ingress from Ingress controller and within cluster
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-system  # Allow from ingress controller
        - namespaceSelector:
            matchLabels:
              name: production   # Allow from same namespace
      ports:
        - protocol: TCP
          port: 5000
  
  # Allow egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    
    # Allow to RDS
    - to:
        - namespaceSelector:
            matchLabels:
              name: production
      ports:
        - protocol: TCP
          port: 5432
    
    # Allow to external APIs (if needed)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
# Pod Disruption Budget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pulsedesk
  namespace: production
  labels:
    app: pulsedesk

spec:
  minAvailable: 2  # Always keep at least 2 pods running
  selector:
    matchLabels:
      app: pulsedesk
      component: backend
