apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsedesk-config
  namespace: production
  labels:
    app: pulsedesk

data:
  # Frontend URL for CORS
  frontend-url: "https://pulsedesk.example.com"
  
  # Application environment
  node-env: "production"
  
  # Logging
  log-level: "info"
  
  # Prometheus
  prometheus-enabled: "true"

---
# Secrets Template (IMPORTANT: Create with kubectl or secrets manager)
# Run: kubectl create secret generic pulsedesk-secrets \
#        --from-literal=database-url='postgresql://user:pass@host:5432/db' \
#        --from-literal=jwt-secret='your-secret-key' \
#        -n production
#
# OR use AWS Secrets Manager and External Secrets Operator (ESO)

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: pulsedesk-secrets
  namespace: production

spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: pulsedesk

---
# External Secret - syncs from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pulsedesk-secrets
  namespace: production

spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: pulsedesk-secrets
    kind: SecretStore
  
  target:
    name: pulsedesk-secrets
    creationPolicy: Owner
  
  data:
    - secretKey: database-url
      remoteRef:
        key: pulsedesk/database-url
    
    - secretKey: jwt-secret
      remoteRef:
        key: pulsedesk/jwt-secret
