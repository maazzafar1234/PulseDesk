apiVersion: v1
kind: Service
metadata:
  name: pulsedesk
  namespace: production
  labels:
    app: pulsedesk
    component: backend
  annotations:
    description: "PulseDesk backend API service"

spec:
  type: ClusterIP  # Internal service (will be exposed via Ingress)
  
  ports:
    - name: http
      port: 80              # Service port
      targetPort: 5000      # Container port
      protocol: TCP
    
    - name: metrics
      port: 9090
      targetPort: 5000      # Metrics on same port with path /metrics
      protocol: TCP
  
  selector:
    app: pulsedesk
    component: backend
  
  sessionAffinity: None  # No session affinity for stateless API
  
  # For zero-downtime deployments
  publishNotReadyAddresses: false

---
# Headless Service for StatefulSet-like operations (if needed)
apiVersion: v1
kind: Service
metadata:
  name: pulsedesk-headless
  namespace: production
  labels:
    app: pulsedesk
    component: backend

spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  
  selector:
    app: pulsedesk
    component: backend

---
# External Name Service for RDS (optional, if using RDS endpoint directly)
# This allows pods to reference the RDS database using a stable K8s DNS name
apiVersion: v1
kind: Service
metadata:
  name: pulsedesk-rds
  namespace: production
  labels:
    app: pulsedesk
    component: database

spec:
  type: ExternalName
  # Update this to your actual RDS endpoint
  externalName: pulsedesk.abc123.us-east-1.rds.amazonaws.com
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
