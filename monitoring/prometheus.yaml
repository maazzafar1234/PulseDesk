apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring

---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'pulsedesk-production'
        environment: 'production'
    
    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    
    # Scrape configurations
    scrape_configs:
      # Prometheus self-scrape
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
      
      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
      
      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
      
      # PulseDesk Application Metrics
      - job_name: 'pulsedesk'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: pulsedesk
          - source_labels: [__address__]
            action: replace
            replacement: $1:5000
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: replace
            target_label: component
      
      # RDS PostgreSQL (if using RDS monitoring)
      - job_name: 'rds-postgresql'
        static_configs:
          - targets: ['cloudwatch-exporter:9106']
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: 'aws_rds_.*'

---
# Prometheus AlertRules ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
  labels:
    app: prometheus

data:
  alert-rules.yml: |
    groups:
      - name: pulsedesk.rules
        interval: 30s
        rules:
          # Pod Alerts
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="production",pod=~"pulsedesk.*"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
              service: pulsedesk
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
          
          # Application Performance Alerts
          - alert: HighErrorRate
            expr: rate(http_requests_total{job="pulsedesk",status=~"5.."}[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
              service: pulsedesk
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"
          
          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="pulsedesk"}[5m])) > 1
            for: 5m
            labels:
              severity: warning
              service: pulsedesk
            annotations:
              summary: "High latency detected"
              description: "95th percentile latency is {{ $value }}s"
          
          - alert: RateLimitExceeded
            expr: rate(http_requests_total{job="pulsedesk",status="429"}[5m]) > 0
            for: 2m
            labels:
              severity: warning
              service: pulsedesk
            annotations:
              summary: "Rate limiting is being triggered"
              description: "{{ $value | humanize }} requests are hitting rate limits"
          
          # Resource Alerts
          - alert: ContainerMemoryUsageHigh
            expr: (container_memory_usage_bytes{pod=~"pulsedesk.*",namespace="production"} / container_spec_memory_limit_bytes) > 0.9
            for: 5m
            labels:
              severity: warning
              service: pulsedesk
            annotations:
              summary: "Container memory usage is high"
              description: "Memory usage is {{ $value | humanizePercentage }}"
          
          - alert: ContainerCPUUsageHigh
            expr: (rate(container_cpu_usage_seconds_total{pod=~"pulsedesk.*",namespace="production"}[5m]) / (container_spec_cpu_quota / container_spec_cpu_period)) > 0.9
            for: 5m
            labels:
              severity: warning
              service: pulsedesk
            annotations:
              summary: "Container CPU usage is high"
              description: "CPU usage is {{ $value | humanizePercentage }}"
          
          # Database Alerts (RDS)
          - alert: RDSHighCPU
            expr: aws_rds_cpu_utilization > 80
            for: 5m
            labels:
              severity: warning
              service: pulsedesk
            annotations:
              summary: "RDS CPU usage is high"
              description: "RDS CPU usage is {{ $value }}%"
          
          - alert: RDSLowFreeableMemory
            expr: aws_rds_freeable_memory < 1073741824
            for: 5m
            labels:
              severity: critical
              service: pulsedesk
            annotations:
              summary: "RDS memory is low"
              description: "RDS available memory is {{ $value | humanize }}B"
          
          # Availability Alerts
          - alert: PulseDeskDown
            expr: up{job="pulsedesk"} == 0
            for: 1m
            labels:
              severity: critical
              service: pulsedesk
            annotations:
              summary: "PulseDesk is down"
              description: "PulseDesk pod {{ $labels.pod }} is not responding"

---
# Prometheus StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus

spec:
  serviceName: prometheus
  replicas: 2
  
  selector:
    matchLabels:
      app: prometheus
  
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    
    spec:
      serviceAccountName: prometheus
      
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          imagePullPolicy: IfNotPresent
          
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
            - --web.enable-admin-api
          
          ports:
            - name: web
              containerPort: 9090
              protocol: TCP
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
          
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: alert-rules
              mountPath: /etc/prometheus/rules
            - name: storage
              mountPath: /prometheus
          
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 30
            periodSeconds: 10
      
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: alert-rules
          configMap:
            name: prometheus-alert-rules
  
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus

spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    app: prometheus

---
# ServiceAccount for Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
# ClusterRole for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus

rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

---
# Grafana Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-pulsedesk
  namespace: monitoring
  labels:
    app: grafana
    dashboard: pulsedesk

data:
  pulsedesk-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "PulseDesk Application Monitoring",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"hideFrom": {"tooltip": false, "viz": false, "legend": false}},
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
            "pieType": "piechart"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"pulsedesk\"}[5m])) by (status)",
              "refId": "A"
            }
          ],
          "title": "Request Rate by Status",
          "type": "piechart"
        },
        {
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"pulsedesk\"}[5m]))",
              "refId": "A"
            }
          ],
          "title": "P95 Latency",
          "type": "graph"
        },
        {
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_requests_total{job=\"pulsedesk\",status=~\"5..\"}[5m])",
              "refId": "A"
            }
          ],
          "title": "Error Rate",
          "type": "graph"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 30,
      "style": "dark",
      "tags": ["pulsedesk", "production"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "PulseDesk Monitoring Dashboard",
      "uid": "pulsedesk-main",
      "version": 1
    }
