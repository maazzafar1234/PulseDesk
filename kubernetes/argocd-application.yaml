apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulsedesk-app
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/maazzafar1234/PulseDesk.git
    targetRevision: main
    path: kubernetes
  
  destination:
    server: https://kubernetes.default.svc
    namespace: pulsedesk
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
