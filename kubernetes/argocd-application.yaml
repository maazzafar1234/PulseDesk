apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulsedesk-app
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/maazzafar1234/PulseDesk.git
    targetRevision: main
    path: kubernetes
  
  destination:
    server: https://kubernetes.default.svc
    namespace: pulsedesk
  
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
