---
# ConfigMap for Grafana dashboards
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  pulsedesk-overview.json: |
    {
      "dashboard": {
        "title": "PulseDesk Application Overview",
        "description": "PulseDesk Backend and Frontend Overview",
        "tags": ["pulsedesk", "application"],
        "timezone": "browser",
        "panels": [
          {
            "title": "HTTP Requests Per Second",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "P95 Request Latency",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Error Rate",
            "targets": [
              {
                "expr": "rate(http_errors_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Memory Usage",
            "targets": [
              {
                "expr": "process_memory_usage_bytes{type='heap_used'}"
              }
            ],
            "type": "graph"
          },
          {
            "title": "CPU Usage",
            "targets": [
              {
                "expr": "process_cpu_usage_percent"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Database Query Duration",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m]))"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Open Tickets",
            "targets": [
              {
                "expr": "tickets_open_current"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Tickets Created Today",
            "targets": [
              {
                "expr": "increase(tickets_created_total[24h])"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Authentication Success Rate",
            "targets": [
              {
                "expr": "rate(auth_attempts_total{status='success'}[5m]) / rate(auth_attempts_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Request Duration by Endpoint",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) by (route)"
              }
            ],
            "type": "table"
          }
        ],
        "refresh": "30s",
        "schemaVersion": 27,
        "style": "dark",
        "templating": {
          "list": []
        },
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "timepicker": {},
        "uid": "pulsedesk-overview",
        "version": 0
      }
    }

  pulsedesk-backend.json: |
    {
      "dashboard": {
        "title": "PulseDesk Backend Services",
        "description": "Backend API Performance and Health",
        "tags": ["pulsedesk", "backend", "api"],
        "panels": [
          {
            "title": "Backend Uptime",
            "targets": [
              {
                "expr": "process_uptime_seconds"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Active Database Connections",
            "targets": [
              {
                "expr": "db_connections_active"
              }
            ],
            "type": "stat"
          },
          {
            "title": "API Endpoints Response Time",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{route=~'/api.*'}[5m])) by (route)"
              }
            ],
            "type": "table"
          },
          {
            "title": "Database Query Errors",
            "targets": [
              {
                "expr": "rate(db_query_errors_total[5m]) by (operation, table)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Request Size Distribution",
            "targets": [
              {
                "expr": "rate(http_request_size_bytes_bucket[5m])"
              }
            ],
            "type": "heatmap"
          },
          {
            "title": "Response Size Distribution",
            "targets": [
              {
                "expr": "rate(http_response_size_bytes_bucket[5m])"
              }
            ],
            "type": "heatmap"
          }
        ],
        "refresh": "30s",
        "time": {
          "from": "now-1h",
          "to": "now"
        }
      }
    }

  pulsedesk-business.json: |
    {
      "dashboard": {
        "title": "PulseDesk Business Metrics",
        "description": "Ticket and User Activity Metrics",
        "tags": ["pulsedesk", "business"],
        "panels": [
          {
            "title": "Tickets by Priority",
            "targets": [
              {
                "expr": "tickets_open_current by (priority)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Tickets by Category",
            "targets": [
              {
                "expr": "tickets_open_current by (category)"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Ticket Creation Rate",
            "targets": [
              {
                "expr": "rate(tickets_created_total[1h])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Ticket Resolution Rate",
            "targets": [
              {
                "expr": "rate(tickets_resolved_total[1h])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Active Users by Role",
            "targets": [
              {
                "expr": "users_active_current by (role)"
              }
            ],
            "type": "stat"
          },
          {
            "title": "Authentication Attempts",
            "targets": [
              {
                "expr": "rate(auth_attempts_total[5m]) by (method, status)"
              }
            ],
            "type": "graph"
          }
        ],
        "refresh": "1m",
        "time": {
          "from": "now-24h",
          "to": "now"
        }
      }
    }

  pulsedesk-alerts.json: |
    {
      "dashboard": {
        "title": "PulseDesk Alerts",
        "description": "Alert Rules and Status",
        "tags": ["pulsedesk", "alerts"],
        "panels": [
          {
            "title": "High Error Rate Alert",
            "alert": {
              "name": "HighErrorRate",
              "conditions": [
                {
                  "evaluator": {
                    "params": [0.05],
                    "type": "gt"
                  },
                  "operator": {
                    "type": "and"
                  },
                  "query": {
                    "params": ["A", "5m", "now"]
                  },
                  "type": "query"
                }
              ],
              "frequency": "1m",
              "handler": 1,
              "message": "Error rate is above 5%"
            }
          },
          {
            "title": "High Memory Usage Alert",
            "alert": {
              "name": "HighMemory",
              "conditions": [
                {
                  "evaluator": {
                    "params": [800000000],
                    "type": "gt"
                  }
                }
              ],
              "frequency": "2m",
              "message": "Memory usage above 800MB"
            }
          },
          {
            "title": "High API Latency Alert",
            "alert": {
              "name": "HighLatency",
              "conditions": [
                {
                  "evaluator": {
                    "params": [2],
                    "type": "gt"
                  }
                }
              ],
              "frequency": "1m",
              "message": "P95 latency above 2 seconds"
            }
          },
          {
            "title": "Database Connection Pool Exhausted",
            "alert": {
              "name": "DBConnectionExhausted",
              "conditions": [
                {
                  "evaluator": {
                    "params": [95],
                    "type": "gt"
                  }
                }
              ],
              "frequency": "1m",
              "message": "Database connection pool usage above 95%"
            }
          }
        ],
        "refresh": "30s",
        "time": {
          "from": "now-7d",
          "to": "now"
        }
      }
    }

---
# ServiceMonitor for Prometheus to scrape metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pulsedesk-metrics
  namespace: pulsedesk
spec:
  selector:
    matchLabels:
      app: pulsedesk-backend
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
# PrometheusRule for alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pulsedesk-alerts
  namespace: monitoring
spec:
  groups:
  - name: pulsedesk.rules
    interval: 30s
    rules:
    - alert: HighErrorRate
      expr: |
        rate(http_errors_total[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value | humanizePercentage }}"

    - alert: HighLatency
      expr: |
        histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High API latency"
        description: "P95 latency is {{ $value | humanizeDuration }}"

    - alert: HighMemoryUsage
      expr: |
        process_memory_usage_bytes{type="heap_used"} > 800000000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage"
        description: "Heap memory is {{ $value | humanize }}B"

    - alert: HighDatabaseLatency
      expr: |
        histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High database query latency"
        description: "P95 query latency is {{ $value | humanizeDuration }}"

    - alert: DatabaseQueryErrors
      expr: |
        rate(db_query_errors_total[5m]) > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Database query errors"
        description: "{{ $value | humanize }} errors per second"
