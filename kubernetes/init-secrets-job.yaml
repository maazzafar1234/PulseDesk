apiVersion: batch/v1
kind: Job
metadata:
  name: init-app-secrets
  namespace: pulsedesk
  labels:
    app: init-secrets
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300  # Keep job for 5 minutes after completion
  template:
    metadata:
      labels:
        app: init-secrets
    spec:
      serviceAccountName: secret-creator
      restartPolicy: Never
      containers:
      - name: secret-creator
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Creating app-secrets..."
          
          # Check if secret already exists
          if kubectl get secret app-secrets -n pulsedesk 2>/dev/null; then
            echo "✅ app-secrets already exists"
          else
            echo "Creating app-secrets..."
            kubectl create secret generic app-secrets \
              --from-literal=jwt-secret="G8bevQWT/MFhrcPeCH6T9urt8mxc99GelanPGYr49E0=" \
              -n pulsedesk || true
            echo "✅ app-secrets created"
          fi
          
          echo "Verifying..."
          kubectl get secret app-secrets -n pulsedesk
          echo "✅ Job complete"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-creator
  namespace: pulsedesk

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-creator
  namespace: pulsedesk
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-creator
  namespace: pulsedesk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-creator
subjects:
- kind: ServiceAccount
  name: secret-creator
  namespace: pulsedesk
